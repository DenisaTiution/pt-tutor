<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tabu — Jogo de Palavras</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#d81b60">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <div id="root">
    <header class="header">
      <h1>🎮 Tabu</h1>
      <p class="subtitle">Jogo de Palavras em Português</p>
    </header>

    <main class="container">
      <section id="app"></section>
    </main>

    <footer class="footer">
      <small>Dados guardados localmente no seu dispositivo</small>
    </footer>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW error:', err));
    }
  </script>
</body>
</html>
